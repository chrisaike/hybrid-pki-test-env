name: ci

# Build, test, and run the PKI certification harness. The certification report
# gates the pipeline: if any trust-path check fails, the job fails.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write      # allow the JUnit reporter to publish check runs

jobs:
  build-test-certify:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: 'on'      # force module mode — the repo is its own module
      # Do NOT set -mod=mod: with a private repo it makes `go vet` try to fetch
      # the module's own path over the network (auth fails). Default readonly
      # resolves local packages without any network. GOPRIVATE ensures Go never
      # attempts to fetch this private module path.
      GOPRIVATE: 'github.com/chrisaike/*'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          check-latest: true

      - name: Go environment
        run: |
          go version
          echo "PWD=$(pwd)"
          ls -la go.mod
          go env GO111MODULE GOFLAGS GOPROXY GOPRIVATE GOMOD GOPATH

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (default build)
        run: go test ./...

      - name: Build (pqc-tagged) compiles
        run: go build -tags pqc ./...

      - name: Build binaries
        run: make build

      - name: Certify (emits JSON + JUnit; non-zero exit fails the job)
        run: make certify

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-report
          path: |
            out/certification-report.json
            out/certification-report.xml

      - name: Publish JUnit test report
        if: always()
        continue-on-error: true   # a restricted token must not fail the build
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: out/certification-report.xml
          fail_on_failure: false
