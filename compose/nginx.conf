# Load balancer for the PKI test replicas (Requirement 6).
# Round-robins across replicas and health-checks via /healthz; a replica that
# fails is taken out of rotation so the service survives one replica loss.

events {}

http {
    upstream pki_backend {
        # passive health checks: mark a replica down after failures
        server pki-r1:8080 max_fails=2 fail_timeout=10s;
        server pki-r2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8080;

        location /healthz {
            proxy_pass http://pki_backend;
        }

        location / {
            proxy_pass http://pki_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
